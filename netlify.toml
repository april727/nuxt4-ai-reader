[build]
  command = "npx nypm install && npm run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  SECRETS_SCAN_OMIT_KEYS = "DEEPSEEK_API_KEY,DEEPSEEK_MODEL,DEEPSEEK_BASE_URL,TURSO_URL,TURSO_AUTH_TOKEN,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_ENDPOINT,R2_BUCKET,R2_ACCOUNT_ID,USE_R2,NUXT_PUBLIC_DISABLE_LOCAL_UPLOAD"
